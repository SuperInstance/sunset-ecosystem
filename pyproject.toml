[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sunset-ecosystem"
version = "0.1.0"
description = "Trinity-architecture agent ecosystem: ethos (metal), pathos (human), logos (code). Agents sunset with dignity and seed the next generation."
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "evolution", "trinity", "sunset", "micro-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gpu = ["torch", "numpy"]
dev = ["pytest>=7.0", "pytest-cov"]
ecosystem = [
    "eisenstein-embed @ file:///home/phoenix/.openclaw/workspace/eisenstein-embed",
    "device-router @ file:///home/phoenix/.openclaw/workspace/device-router",
    "tensor-spline @ file:///home/phoenix/.openclaw/workspace/tensor-spline",
    "triplet-miner @ file:///home/phoenix/.openclaw/workspace/triplet-miner",
]

[tool.setuptools.packages.find]
include = ["ethos*", "pathos*", "logos*", "sunset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
