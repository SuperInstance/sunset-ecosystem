[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunset-ecosystem"
version = "0.1.0"
description = "Trinity-architecture agent ecosystem: ethos (metal), pathos (human), logos (code). Agents sunset with dignity and seed the next generation."
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "evolution", "trinity", "sunset", "micro-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gpu = ["torch", "numpy", "scipy"]
npu = ["onnx", "onnxruntime", "torch", "numpy", "scipy"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-json-report",  # required by fleet shared python-ci (--json-report)
    "fastapi",  # tests/test_fleet_api.py
    "httpx",  # fastapi TestClient backend
    "nlopt",  # flux_compat.nlopt_solver tests
    "pytest-asyncio",
    "numpy",
    "cryptography",
    "requests",
    "numba",
    "psutil",
    "mypy",
    "ruff>=0.4.0",
    "bandit[toml]",
    "pip-audit",
    "pyarrow",
    "pyyaml",
    "pillow",
]
perception = ["pillow", "sounddevice", "pyaudio; sys_platform != \"linux\"", "opencv-python-headless"]
ml = ["transformers", "torchvision", "timm", "clip", "speechbrain", "openai-whisper"]
vecsearch = ["turbovec>=0.1.0", "numpy"]
gpu_cuda = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
include = [
    "ethos*", "pathos*", "logos*", "sunset*", "swarm*", "nexus*", "grammar*",
    "nerve*", "triage*", "flux_compat*", "superinstance*", "fleet*", "distill*",
    "a2a*", "ranking*", "perception*", "experiments*", "jepa*", "simulators*",
    "reasoning*", "compiler*", "voice*", "agentic_compiler*", "plato_core*",
    "tensor_spline*", "eisenstein_embed*", "triplet_miner*", "stable_worldmodel*",
    "user_ranking*", "ranked_response*", "tournament_sim*", "vision_encoder*",
    "audio_encoder*", "capture*", "audio_capture*", "cognition_loop*",
    "constraint_theory*", "flux_vm*", "v3_module*", "opcode_map*", "superinstance_ffi_mock*",
    "tests*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--ignore=tests/benchmarks"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Baseline for the fleet shared python-ci workflow (agent-operations/python-ci.yml
# runs `ruff check .` + `ruff format --check .`).
#
# This repo predates linting: the broader rule sets surface ~8.8k legacy
# findings (~6.8k mechanical autofixes — UP006/UP045/UP035 typing
# modernization, F401 unused imports, I001 import sorting; plus ~140
# E4xx/E7xx style hits that are this repo's idioms: sys.path-bootstrap
# imports mid-file in tests/scripts, lambda fixtures, single-letter loop
# vars). Those belong to dedicated cleanup passes, not the CI-migration PR.
# Baseline below = what actually signals broken code: syntax errors (E9)
# and assertion mistakes (F63). New code should aim higher.
select = ["E9", "F63"]
