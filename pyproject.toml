[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunset-ecosystem"
version = "0.1.0"
description = "Trinity-architecture agent ecosystem: ethos (metal), pathos (human), logos (code). Agents sunset with dignity and seed the next generation."
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "evolution", "trinity", "sunset", "micro-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gpu = ["torch", "numpy"]
npu = ["onnx", "onnxruntime", "torch", "numpy"]
dev = ["pytest>=7.0", "pytest-cov", "pytest-asyncio", "numpy", "cryptography", "requests", "numba", "psutil"]
# ecosystem deps removed - local file:// URLs not allowed on PyPI
vecsearch = ["turbovec>=0.1.0", "numpy"]

[tool.setuptools.packages.find]
include = ["ethos*", "pathos*", "logos*", "sunset*", "swarm*", "nexus*", "grammar*", "nerve*", "triage*", "flux_compat*", "superinstance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
